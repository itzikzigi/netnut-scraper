# Postgres — StatefulSet + headless Service + Secret.
# For production, prefer a managed DB (RDS / Cloud SQL) over running Postgres on the cluster.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: netnut
type: Opaque
stringData:
  POSTGRES_USER: netnut
  POSTGRES_PASSWORD: netnut
  POSTGRES_DB: netnut
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: netnut
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: netnut
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "netnut", "-d", "netnut"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "netnut", "-d", "netnut"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
